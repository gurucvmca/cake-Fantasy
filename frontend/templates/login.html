<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Shop — Sweet Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0F0515;
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 50%, rgba(232,54,79,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 80% 30%, rgba(120,40,200,0.1) 0%, transparent 70%),
                radial-gradient(ellipse 40% 50% at 50% 90%, rgba(245,166,35,0.07) 0%, transparent 70%);
            animation: bgPulse 15s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 35px 35px;
        }
        @keyframes bgPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) translate(-3%, 2%); }
        }

        .box {
            width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 800;
            font-size: 2.2rem;
        }
        p.subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Flash Messages */
        .flash-messages { margin-bottom: 20px; list-style: none; }
        .flash {
            padding: 12px; border-radius: 12px;
            font-size: 0.82rem; font-weight: 600; margin-bottom: 10px;
        }
        .flash.error { background: rgba(232,54,79,0.15); color: #FF6B81; border: 1px solid rgba(232,54,79,0.25); }
        .flash.success { background: rgba(39,174,96,0.15); color: #6BCB77; border: 1px solid rgba(39,174,96,0.25); }

        input {
            width: 100%;
            padding: 15px 18px;
            margin: 10px 0;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            transition: 0.3s;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus {
            border-color: #E8364F;
            background: rgba(232,54,79,0.06);
            box-shadow: 0 0 20px rgba(232,54,79,0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E8364F, #FF7849);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(232,54,79,0.3);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(232,54,79,0.45);
        }

        .link {
            margin-top: 25px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .link b { color: #FF6B81; }
        .link:hover b { text-decoration: underline; }

        .hidden { display: none; }

        @media (max-width: 480px) { .box { width: 92%; padding: 35px 25px; } }
    </style>
</head>
<body>

<div class="box">
    <h1>Cake Shop</h1>
    <p class="subtitle">Indulge in sweetness</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-messages">
          {% for category, message in messages %}
            <li class="flash {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form id="loginForm" action="/login" method="post">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login to Account</button>
        <div class="link" onclick="showSignup()">Don't have an account? <b>Sign up</b></div>
    </form>

    <form id="signupForm" class="hidden" action="/signup" method="post">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Choose a Password" required>
        <button type="submit">Create Free Account</button>
        <div class="link" onclick="showLogin()">Already a member? <b>Login here</b></div>
    </form>
</div>

<script>
    function showSignup() {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("signupForm").classList.remove("hidden");
    }
    function showLogin() {
        document.getElementById("signupForm").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
    }

    // Disable browser back/forward navigation (prevents going back to protected pages after logout)
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.pushState(null, null, location.href);
    };
</script>

</body>
</html>
