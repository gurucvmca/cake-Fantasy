<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — Cake Shop</title>
    <link rel="stylesheet" href="/static/shop.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 5%;
        }
        .success-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border-radius: var(--radius);
            padding: 60px 45px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            font-size: 4.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .success-card h1 { font-family: 'Playfair Display', serif; color: var(--white); font-size: 2rem; margin-bottom: 8px; }
        .success-card p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px; }

        .order-details {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 22px;
            text-align: left;
            margin-bottom: 35px;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { color: var(--text-muted); }
        .detail-row .value { font-weight: 700; color: var(--white); }

        .btn-home {
            background: linear-gradient(135deg, var(--primary), var(--accent2));
            color: white; padding: 15px 40px; border-radius: 50px;
            font-weight: 700; text-decoration: none; display: inline-block;
            transition: var(--transition); box-shadow: 0 8px 25px rgba(232,54,79,0.3);
        }
        .btn-home:hover { transform: scale(1.05); box-shadow: 0 14px 35px rgba(232,54,79,0.4); }
    </style>
</head>
<body class="success-page">
    <div class="success-card">
        <div class="success-icon">🎉</div>
        <h1>Sweet Victory!</h1>
        <p class="subtitle">Your order has been placed successfully.</p>
        <div class="order-details">
            <div class="detail-row"><span class="label">Item</span><span class="value">{{ cake }}</span></div>
            <div class="detail-row"><span class="label">Total</span><span class="value" style="color:var(--accent);">₹{{ price }}</span></div>
            <div class="detail-row"><span class="label">Payment</span><span class="value">{{ payment }}</span></div>
            <div class="detail-row"><span class="label">Status</span><span class="value" style="color:#6BCB77;">Preparing</span></div>
        </div>
        <p style="margin-bottom:25px; font-size:0.85rem; color:var(--text-muted);">Our chefs are preheating the oven. Delivery update coming soon.</p>
        <a href="/welcome" class="btn-home">Back to Shop</a>
    </div>
</body>
</html>
